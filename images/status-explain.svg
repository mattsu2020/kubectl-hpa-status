  <rect x="28" y="214" width="904" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="241" fill="#facc15" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15" font-weight="600">Summary: HPA currently wants to scale up (3 -&gt; 5).</text>

  <text x="28" y="294" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="14" font-weight="700">Metrics &amp; Interpretation:</text>
