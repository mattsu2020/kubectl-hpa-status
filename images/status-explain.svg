  <text x="44" y="358" fill="#a5d6ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">- [confidence: high] desiredReplicas is greater than currentReplicas.</text>
  <text x="44" y="390" fill="#8b949e" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="14">- ScalingActive=True; no stabilization delay or maxReplicas cap active.</text>
