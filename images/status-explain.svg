<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="status explain output">
  <rect width="960" height="440" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M 0 12 Q 0 0 12 0 L 948 0 Q 960 0 960 12 L 960 40 L 0 40 Z" fill="#161b22"/>
  <line x1="0" y1="40" x2="960" y2="40" stroke="#30363d" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="480" y="25" text-anchor="middle" fill="#8b949e" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="13" font-weight="600">status --explain</text>

  <text x="28" y="80" fill="#7ee787" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="16" font-weight="700">$</text>
  <text x="46" y="80" fill="#f0f6fc" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="16" font-weight="600">kubectl hpa_status status web --explain</text>

  <text x="28" y="124" fill="#58a6ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15" font-weight="700">HPA:</text>
  <text x="112" y="124" fill="#e6edf3" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">default/web (Deployment/web)</text>
  <text x="28" y="156" fill="#58a6ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15" font-weight="700">Replicas:</text>
  <text x="122" y="156" fill="#e6edf3" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">current=3  desired=5  min=2  max=10</text>
  <text x="28" y="188" fill="#58a6ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15" font-weight="700">Health:</text>
