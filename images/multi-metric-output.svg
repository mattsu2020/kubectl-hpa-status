  <line x1="0" y1="40" x2="960" y2="40" stroke="#30363d" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="480" y="25" text-anchor="middle" fill="#8b949e" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13" font-weight="600">kubectl hpa_status status web-multi --explain</text>

  <text x="28" y="80" fill="#7ee787" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15" font-weight="700">$</text>
  <text x="46" y="80" fill="#f0f6fc" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15" font-weight="600">kubectl hpa_status status web-multi --explain</text>

  <text x="28" y="120" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" font-weight="700">Target:</text>
  <text x="102" y="120" fill="#e6edf3" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">default/web-multi (Deployment/web-multi)</text>

  <text x="28" y="148" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" font-weight="700">Replicas:</text>
  <text x="118" y="148" fill="#e6edf3" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">4 current / 6 desired (min 2, max 10)</text>

  <text x="28" y="186" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" font-weight="700">Metrics:</text>
  <text x="42" y="214" fill="#c9d1d9" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">- Resource cpu</text>
  <text x="204" y="214" fill="#8b949e" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">current=70%  target=80%  ratio=0.875</text>

  <text x="42" y="242" fill="#e6edf3" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" font-weight="600">- Resource memory</text>
  <text x="204" y="242" fill="#ffa657" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" font-weight="600">current=68%  target=50%  ratio=1.360</text>
  <rect x="536" y="226" width="144" height="22" rx="6" fill="#ffa657" fill-opacity="0.16" stroke="#ffa657" stroke-opacity="0.45"/>
  <text x="608" y="241" text-anchor="middle" fill="#ffa657" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" font-weight="700">LARGEST DISTANCE</text>

  <rect x="28" y="274" width="904" height="126" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="302" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" font-weight="700">Impact estimate:</text>
  <text x="44" y="328" fill="#e6edf3" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">memory has the largest visible distance from target (ratio=1.360).</text>
  <text x="44" y="362" fill="#8b949e" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13" font-weight="700">Caveat:</text>
  <text x="110" y="362" fill="#8b949e" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13">Kubernetes does not expose the exact per-metric winner; HPA selects the</text>
  <text x="44" y="382" fill="#8b949e" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13">highest recommended replica count across all configured metrics.</text>
</svg>
