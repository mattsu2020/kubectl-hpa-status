<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="JSON output">
  <rect width="960" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M 0 12 Q 0 0 12 0 L 948 0 Q 960 0 960 12 L 960 40 L 0 40 Z" fill="#161b22"/>
