  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="480" y="25" text-anchor="middle" fill="#8b949e" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="13" font-weight="600">structured output (-o json, hpa-status/v2)</text>

  <text x="28" y="80" fill="#7ee787" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="16" font-weight="700">$</text>
  <text x="46" y="80" fill="#f0f6fc" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="16" font-weight="600">kubectl hpa_status status web -o json</text>

  <text x="28" y="122" fill="#c9d1d9" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">{</text>
  <text x="48" y="150" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">"apiVersion": <tspan fill="#a5d6ff">"hpa-status/v2"</tspan>,</text>
  <text x="48" y="178" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">"analysis": {</text>
  <text x="72" y="206" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">"meta": { <tspan fill="#7ee787">"namespace"</tspan>: <tspan fill="#a5d6ff">"default"</tspan>, <tspan fill="#7ee787">"name"</tspan>: <tspan fill="#a5d6ff">"web"</tspan> },</text>
  <text x="72" y="234" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">"replicas": { <tspan fill="#7ee787">"current"</tspan>: <tspan fill="#f2cc60">3</tspan>, <tspan fill="#7ee787">"desired"</tspan>: <tspan fill="#f2cc60">5</tspan> },</text>
  <text x="72" y="262" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">"decision": {</text>
  <text x="96" y="290" fill="#7ee787" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">"health": <tspan fill="#a5d6ff">"OK"</tspan>, <tspan fill="#7ee787">"healthScore"</tspan>: <tspan fill="#f2cc60">100</tspan>,</text>
  <text x="96" y="318" fill="#7ee787" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">"summary": <tspan fill="#a5d6ff">"HPA currently wants to scale up."</tspan></text>
  <text x="72" y="346" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">},</text>
  <text x="72" y="374" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">"actions": { <tspan fill="#7ee787">"suggestions"</tspan>: [] }</text>
  <text x="48" y="402" fill="#79c0ff" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="15">}</text>
