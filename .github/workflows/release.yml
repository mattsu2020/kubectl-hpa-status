name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  # id-token: write is required for cosign keyless signing (OIDC) and for the
  # SLSA provenance generator to attest the build.
  id-token: write
  # attestations: write lets the SLSA generator attach provenance to the release.
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Release gates plus multi-platform builds; bounded so a hung step cannot
    # burn the 360-minute default on tag builds.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Verify reproducible module inputs
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt would modify the following files:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detection
        run: go test -race ./...

      - name: Coverage gate
        run: |
          go test -coverprofile=coverage.out ./...
          bash scripts/check-coverage.sh coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          go-package: ./...

      # Install cosign for keyless sigstore signing of release artifacts.
      # COSIGN_EXPERIMENTAL=1 enables keyless (certificate-based) signing that
      # does not require a persisted private key.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.6.3'

      # GoReleaser delegates archive SBOM generation to Syft. Install a pinned,
      # immutable Syft release explicitly so a tag build cannot silently lose
      # the SBOM artifacts declared in .goreleaser.yml.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.44.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: '1'

      # Generate SLSA Build Level 3 provenance attestation for the release
      # artifacts so downstream users can verify the build origin.
      - name: Generate artifact provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Update krew-index
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
