name: ci

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref so a rapid succession of pushes
# (common during PR iteration) does not queue multiple expensive e2e matrices.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Bound every job so a hung runner cannot burn the 360-minute default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Cross-platform matrix: the plugin is cross-compiled for linux/darwin/
      # windows on amd64/arm64, but unit tests previously only ran on Linux.
      # macOS coverage catches filesystem and path-handling regressions
      # (history store, kubeconfig resolution) that Linux does not surface.
      # Windows is excluded for now because the TUI and shell-completion paths
      # depend on Unix-only behavior; adding it is tracked in ROADMAP.md.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Check go.mod/go.sum tidy
        # Fails if go.mod or go.sum are out of sync with the imports actually
        # used, preventing an un-tidy module from merging. Mirrors the local
        # `make tidy` gate so contributors hit this before pushing.
        # Run on Linux only; module state is OS-independent and macOS minutes
        # are billed at a higher rate on private repos.
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check gofmt
        # Reject un-gofmt'd Go so the lint job does not have to surface basic
        # formatting errors. Mirrors the local `make fmt-check` target. Import
        # grouping (goimports) is enforced separately by the golangci-lint job,
        # which runs the goimports formatter from .golangci.yml.
        if: matrix.os == 'ubuntu-latest'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt would modify the following files; run 'gofmt -w' and commit:"
            echo "$out"
            exit 1
          fi

      - name: Compile Windows release target
        # Windows-specific files cannot be exercised on the Unix test runners,
        # but the release publishes windows/amd64. Compile it on every PR so a
        # build-tag or platform API regression is caught before a tag release.
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

      - name: Compile darwin/arm64 release target
        # Same rationale as the Windows compile gate: the release publishes
        # darwin/arm64 (Apple Silicon), which no CI runner builds natively.
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build ./...

      - name: Vet
        # Explicit vet step so vet failures surface as their own error instead
        # of appearing as lint noise inside golangci-lint. Mirrors `make vet`.
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...

      - name: Test
        # macOS runs the plain suite; Linux runs the combined
        # race-plus-coverage pass below instead, which executes every test
        # anyway, so a second plain run would only duplicate wall time.
        if: matrix.os == 'macos-latest'
        run: go test ./...

      - name: Test with race detection and coverage
        # One combined pass replaces the previous plain + race + coverage
        # triple run. -covermode=atomic is required for accurate counts
        # under -race. Race detection is Linux-only: macOS runners are
        # slower and the concurrency behavior we care about is OS-independent.
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
          echo "## Coverage summary"
          go tool cover -func=coverage.out | grep total | awk '{print "Total coverage: "$3}'

      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-coverage.sh coverage.out

      - name: Check README sync
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-readme-sync.sh

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: govulncheck
        if: matrix.os == 'ubuntu-latest'
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          go-package: ./...

      - name: gosec
        if: matrix.os == 'ubuntu-latest'
        uses: securego/gosec@9e6a9843d7a4a6e3e9a8539b02612c8a4aa3f889 # v2.27.1
        with:
          # -exclude disables rules that are intentional for this codebase:
          #   G115 (int->int32 overflow) — every site assigns replica counts
          #     into Kubernetes API *int32 fields (Spec.MaxReplicas etc.),
          #     bounded to realistic ranges, never untrusted input.
          #   G304 (file inclusion via variable) — this is a kubectl plugin;
          #     every os.Open is on a user-supplied CLI path (--manifest,
          #     --timeline-file, --config, history store paths) by design.
          #   G602 (slice index out of range) — false positives on bounded
          #     loops (e.g. i += 2 pairs).
          # File-permission findings are reviewed at each call site: diagnostic
          # bundles/history use 0600/0700, while explicitly shareable GitOps
          # exports carry a narrow #nosec justification.
          args: -exclude G115,G304,G602 ./...

  golangci-lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  # Security scanning with SARIF upload to the GitHub Security tab.
  # Runs gosec with SARIF output and uploads alongside CodeQL findings so all
  # security alerts are visible in one place. Mirrors the gosec exclusions used
  # in the build job (G115/G304/G602).
  code-scanning:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run gosec (SARIF)
        uses: securego/gosec@9e6a9843d7a4a6e3e9a8539b02612c8a4aa3f889 # v2.27.1
        with:
          # Same exclusions as the build-job gosec step; emit SARIF for upload.
          args: -exclude G115,G304,G602 -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  # Forward-compatibility gate: build and test against the next Go release in
  # addition to the version pinned in go.mod. Catches upstream API removals and
  # stdlib behavior changes before they land in the supported toolchain. A
  # future or RC toolchain may not be published yet; that availability failure
  # is reported as a notice and skipped, while actual build/test failures still
  # fail the job once setup succeeds.
  forward-compat:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.27', 'rc']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go ${{ matrix.go-version }}
        id: setup_go
        continue-on-error: true
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
          # Do not use the cache keyed on go.mod; this job intentionally uses
          # a different toolchain.
          cache: false

      - name: Report unavailable toolchain
        if: steps.setup_go.outcome == 'failure'
        env:
          GO_VERSION: ${{ matrix.go-version }}
        run: echo "::notice::Go ${GO_VERSION} is not published for this runner yet; skipping forward-compatibility checks"

      - name: Build
        if: steps.setup_go.outcome == 'success'
        run: go build ./...

      - name: Test
        if: steps.setup_go.outcome == 'success'
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kubernetes:
          - "1.26"
          - "1.28"
          - "1.30"
          - "1.35"
          - "1.36"
        include:
          - kubernetes: "1.26"
            kind-node-image: kindest/node:v1.26.15
          - kubernetes: "1.28"
            kind-node-image: kindest/node:v1.28.15
          - kubernetes: "1.30"
            kind-node-image: kindest/node:v1.30.13
          - kubernetes: "1.35"
            kind-node-image: kindest/node:v1.35.0
          # kindest/node v1.36 images shipped mid-2026 (v1.36.1 is the
          # current kind default); the earlier v1.36.0-only gap is resolved.
          - kubernetes: "1.36"
            kind-node-image: kindest/node:v1.36.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kind
          node_image: ${{ matrix.kind-node-image }}

      - name: Install metrics-server
        # metrics-server is required by the "real HPA behavior" E2E tests
        # (scenario #1: CPU load driving the HPA to maxReplicas, and #2:
        # metrics.k8s.io API detection). Without it those tests skip. The
        # --kubelet-insecure-tls flag is needed because kind nodes serve a
        # self-signed kubelet serving certificate.
        #
        # The version is pinned (instead of releases/latest) for CI
        # reproducibility: a surprise upstream release should not flip E2E
        # behavior on an unrelated PR. Bump deliberately when updating.
        env:
          METRICS_SERVER_VERSION: v0.7.0
        run: |
          kubectl apply -f "https://github.com/kubernetes-sigs/metrics-server/releases/download/${METRICS_SERVER_VERSION}/components.yaml"
          kubectl patch deployment metrics-server -n kube-system --type='json' \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl wait --for=condition=available deployment/metrics-server -n kube-system --timeout=120s
          kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=120s

      - name: Install KEDA and VPA CRDs
        # Install the optional CRDs so the CRD-present E2E branches (VPA
        # conflict #6, KEDA ScaledObject lookup #5) actually exercise the
        # enrichment paths instead of skipping.
        #
        # Versions are pinned for reproducibility and so a CRD fetch failure
        # is distinguishable from a test failure: the download is captured in
        # its own step output rather than swallowed by `|| echo`, and each
        # apply failure is logged with the offending URL before the step
        # continues (CRD-present tests skip cleanly when a CRD is absent).
        env:
          KEDA_VERSION: v2.20.1
          VPA_VERSION: vertical-pod-autoscaler-1.3.1
          REQUIRE_OPTIONAL_CRDS: ${{ matrix.kubernetes == '1.35' }}
        run: |
          keda_url="https://github.com/kedacore/keda/releases/download/${KEDA_VERSION}/keda-${KEDA_VERSION#v}-crds.yaml"
          vpa_url="https://raw.githubusercontent.com/kubernetes/autoscaler/${VPA_VERSION}/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml"

          echo "Fetching KEDA CRDs: ${keda_url}"
          if ! kubectl apply --server-side -f "${keda_url}"; then
            if [ "${REQUIRE_OPTIONAL_CRDS}" = "true" ]; then
              echo "::error::KEDA CRD install failed (${keda_url}); required coverage would be skipped"
              exit 1
            fi
            echo "::warning::KEDA CRD install failed (${keda_url}); CRD-present E2E tests will skip on this compatibility job"
          fi

          echo "Fetching VPA CRDs: ${vpa_url}"
          if ! kubectl apply --server-side -f "${vpa_url}"; then
            if [ "${REQUIRE_OPTIONAL_CRDS}" = "true" ]; then
              echo "::error::VPA CRD install failed (${vpa_url}); required coverage would be skipped"
              exit 1
            fi
            echo "::warning::VPA CRD install failed (${vpa_url}); CRD-present E2E tests will skip on this compatibility job"
          fi

          if kubectl get crd/scaledobjects.keda.sh >/dev/null 2>&1; then
            kubectl wait --for=condition=Established crd/scaledobjects.keda.sh --timeout=120s
          fi
          if kubectl get crd/verticalpodautoscalers.autoscaling.k8s.io >/dev/null 2>&1; then
            kubectl wait --for=condition=Established crd/verticalpodautoscalers.autoscaling.k8s.io --timeout=120s
          fi

      - name: Run E2E Tests
        env:
          E2E_REQUIRED: "1"
        run: |
          kubectl cluster-info
          go test -v -tags=e2e ./test/e2e/...
